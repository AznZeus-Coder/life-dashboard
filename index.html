<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#143d32"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css?v=11"><title>Daybook</title></head><body><section id="auth-panel" class="auth"><div><strong>Cloud sync</strong><span id="sync-status">Sign in to sync phone and PC</span></div><form id="auth-form"><input id="email" type="email" required placeholder="Your email"><button>Send sign-in link</button></form></section><div id="account-actions" class="account-actions" hidden><span id="account-status">Synced</span><button id="sign-out" class="text-btn">Sign out</button></div><header><div><p class="eyebrow">DAYBOOK</p><h1>Today</h1><p id="date"></p></div><button id="install" hidden>Install app</button></header><main><section class="quick"><form id="quick-add"><input id="task-input" required autocomplete="off" placeholder="What needs doing?"><select id="task-priority" aria-label="Priority"><option>Normal</option><option>High</option><option>Low</option></select><select id="task-project" aria-label="Project"><option value="">No project</option></select><input id="task-date" type="date" aria-label="Due date"><button>Add task</button></form></section><section class="brain-grid"><section class="brain-card inbox"><div class="section-title"><h2>Inbox</h2></div><form id="inbox-form" class="inline-form"><input id="inbox-input" required placeholder="Capture a thought, link, or idea"><button>Capture</button></form><div id="inbox-list" class="compact-list"></div></section><section class="brain-card projects"><div class="section-title"><h2>Projects</h2></div><form id="project-form" class="inline-form"><input id="project-name" required placeholder="New project"><button>Add</button></form><div id="project-list" class="compact-list"></div></section></section><section class="layout"><div><div class="section-title"><h2>Tasks</h2><span id="task-count"></span></div><div id="task-list" class="list"></div></div><aside><div class="section-title"><h2>Chores</h2><button id="add-chore" class="text-btn">+ Add</button></div><div id="chore-list" class="list"></div></aside></section><section class="habits"><div class="section-title"><div><h2>Habits</h2><p class="meta">Small daily wins</p></div></div><div id="habit-list" class="habit-grid"></div><form id="habit-form" class="habit-form"><input id="habit-name" required placeholder="Add a habit"><label><input id="habit-minutes" type="number" min="1" value="15"> min</label><button>Add habit</button></form><section class="tracker-panel"><div class="tracker-scroll"><div class="tracker-days"><span class="tracker-label">Habit</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>10</span><span>11</span><span>12</span><span>13</span><span>14</span><span>15</span><span>16</span><span>17</span><span>18</span><span>19</span><span>20</span><span>21</span><span>22</span><span>23</span><span>24</span><span>25</span><span>26</span><span>27</span><span>28</span><span>29</span><span>30</span><span>31</span></div><div id="habit-calendar" class="tracker-grid"></div></div><p id="calendar-summary" class="meta"></p></section></section><section class="brain-grid lower"><section class="brain-card"><div class="section-title"><h2>Journal</h2></div><form id="journal-form" class="stack-form"><textarea id="journal-text" required placeholder="What happened today?"></textarea><button>Save entry</button></form><div id="journal-list" class="compact-list"></div></section><section class="brain-card"><div class="section-title"><h2>Goals</h2></div><form id="goal-form" class="stack-form"><input id="goal-name" required placeholder="Goal"><input id="goal-target" type="date" aria-label="Target date"><button>Add goal</button></form><div id="goal-list" class="compact-list"></div></section><section class="brain-card calendar-events"><div class="section-title"><h2>Calendar</h2></div><form id="event-form" class="stack-form"><input id="event-name" required placeholder="Event"><input id="event-date" type="datetime-local" required aria-label="Event date"><button>Add event</button></form><div id="event-list" class="compact-list"></div></section></section></main><dialog id="chore-dialog"><form id="chore-form" method="dialog"><h2>New recurring chore</h2><label>Name<input id="chore-name" required placeholder="e.g. Take out recycling"></label><label>Repeat every<select id="chore-frequency"><option value="1">day</option><option value="7" selected>week</option><option value="14">2 weeks</option><option value="30">month</option></select></label><div class="dialog-actions"><button value="cancel" class="secondary">Cancel</button><button value="default">Save chore</button></div></form></dialog><footer id="save-status">Saved on this device</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js?v=11"></script></body></html>
