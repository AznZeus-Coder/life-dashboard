<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#143d32"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>Daybook</title></head><body><header><div><p class="eyebrow">DAYBOOK</p><h1>Today</h1><p id="date"></p></div><button id="install" hidden>Install app</button></header><main><section class="quick"><form id="quick-add"><input id="task-input" required autocomplete="off" placeholder="What needs doing?"><input id="task-date" type="date" aria-label="Due date"><button>Add task</button></form></section><section class="layout"><div><div class="section-title"><h2>Tasks</h2><span id="task-count"></span></div><div id="task-list" class="list"></div></div><aside><div class="section-title"><h2>Chores</h2><button id="add-chore" class="text-btn">+ Add</button></div><div id="chore-list" class="list"></div></aside></section></main><dialog id="chore-dialog"><form id="chore-form" method="dialog"><h2>New recurring chore</h2><label>Name<input id="chore-name" required placeholder="e.g. Take out recycling"></label><label>Repeat every<select id="chore-frequency"><option value="1">day</option><option value="7" selected>week</option><option value="14">2 weeks</option><option value="30">month</option></select></label><div class="dialog-actions"><button value="cancel" class="secondary">Cancel</button><button value="default">Save chore</button></div></form></dialog><footer>Saved on this device · sync setup is next</footer><script src="app.js"></script></body></html>
